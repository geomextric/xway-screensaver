# Builds the .deb on every push and pull request. On a v* tag it also
# publishes the .deb as a GitHub release and uploads a signed source package
# to the Launchpad PPA, which builds its own .deb from it.
#
# The PPA job needs two repository secrets: PPA_GPG_KEY, an ASCII-armoured
# private key registered on the Launchpad account that owns the PPA, and
# PPA_GPG_PASSPHRASE, its passphrase (may be empty).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev

      - name: Check the tag, debian/changelog and __version__ agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          changelog=$(dpkg-parsechangelog -S Version)
          module=$(python3 -c 'import xway_screensaver; print(xway_screensaver.__version__)')
          tag=${GITHUB_REF_NAME#v}
          if [ "$changelog" != "$tag" ] || [ "$module" != "$tag" ]; then
            echo "tag $tag, debian/changelog $changelog, __version__ $module" >&2
            exit 1
          fi

      - name: Build the .deb
        run: |
          dpkg-buildpackage -us -uc -b
          mv ../xway-screensaver_*_all.deb .

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: xway-screensaver_*_all.deb

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          {
            # The changelog entry's bullet points, as a Markdown list.
            dpkg-parsechangelog -S Changes | sed -n 's/^  \* /- /p; s/^    \([^ ]\)/  \1/p'
            cat <<NOTES

          **Install or upgrade on Ubuntu, Pop!_OS or Debian**

          \`\`\`sh
          sudo apt install ./xway-screensaver_${version}_all.deb
          \`\`\`

          Needs a Wayland desktop with wlr-layer-shell and ext-idle-notify: COSMIC (tested), KDE Plasma 6, Sway, Hyprland, niri. GNOME isn't supported. It doesn't lock the screen.
          NOTES
          } > notes.md
          gh release create "$GITHUB_REF_NAME" xway-screensaver_*_all.deb \
            --title "xway-screensaver $version" --notes-file notes.md

  ppa:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      PPA: ppa:geomex/ppa
      SERIES: noble
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts dput gnupg curl

      - name: Skip if this version is already in the PPA
        id: check
        run: |
          version=${GITHUB_REF_NAME#v}~${SERIES}1
          owner=${PPA#ppa:}; owner=${owner%%/*}; name=${PPA##*/}
          count=$(curl -sf "https://api.launchpad.net/1.0/~$owner/+archive/ubuntu/$name?ws.op=getPublishedSources&source_name=xway-screensaver&exact_match=true&version=$version" \
            | python3 -c 'import json, sys; print(len(json.load(sys.stdin)["entries"]))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$count" != 0 ]; then
            echo "$version is already in $PPA; nothing to upload"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the signing key
        if: steps.check.outputs.skip != 'true'
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
        run: |
          test -n "$PPA_GPG_KEY" || { echo "the PPA_GPG_KEY secret is not set" >&2; exit 1; }
          printf '%s\n' "$PPA_GPG_KEY" | gpg --batch --import
          mkdir -p ~/.gnupg && echo allow-loopback-pinentry >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          echo "KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build, sign and upload the source package
        if: steps.check.outputs.skip != 'true'
        env:
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          version=${{ steps.check.outputs.version }}
          sed -i "1s/^xway-screensaver (${GITHUB_REF_NAME#v}) /xway-screensaver ($version) /" debian/changelog
          head -1 debian/changelog
          debuild -S -us -uc
          changes=../xway-screensaver_${version}_source.changes
          # debsign runs gpg interactively; this wrapper feeds it the passphrase.
          printf '%s' "$PPA_GPG_PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          printf '#!/bin/sh\nexec gpg --batch --pinentry-mode loopback --passphrase-file "%s" "$@"\n' \
            "$RUNNER_TEMP/passphrase" > "$RUNNER_TEMP/gpg-ci"
          chmod 700 "$RUNNER_TEMP/gpg-ci" "$RUNNER_TEMP/passphrase"
          debsign -k "$KEY_ID" -p "$RUNNER_TEMP/gpg-ci" "$changes"
          dput "$PPA" "$changes"
